function fmt(n) { return n ? n.toLocaleString('vi-VN') + 'đ' : '—'; }

function renderStats(d) {
  const ct = d.filter(s => s.type === 'CT').length;
  const nq = d.filter(s => s.type === 'NQ').length;
  const dl = d.filter(s => s.type === 'DL').length;
  const cums = new Set(d.map(s => s.cum).filter(c => c));
  document.getElementById('stats').innerHTML = `
    <div class="pill"><strong>${d.length}</strong> salon</div>
    <div class="pill" style="color:#5c6bc0;">CT: <strong>${ct}</strong></div>
    <div class="pill" style="color:var(--orange);">NQ: <strong>${nq}</strong></div>
    <div class="pill" style="color:#ff9800;">Độc lập: <strong>${dl}</strong></div>
    <div class="pill"><strong>${cums.size}</strong> cụm</div>
  `;
}

function renderRow(s) {
  let typeTag, klass;
  if (s.type === 'CT') { typeTag = '<span class="tag ct">CT</span>'; klass = 'ct'; }
  else if (s.type === 'NQ') { typeTag = '<span class="tag nq">NQ</span>'; klass = 'nq'; }
  else { typeTag = '<span class="tag dl">ĐL</span>'; klass = 'dl'; }
  return `<tr class="row ${klass}">
    <td>${typeTag}</td>
    <td><strong>${s.code}</strong></td>
    <td>${(s.ten || '').substring(0, 32)}</td>
    <td>${(s.tinh || '').substring(0, 16)}</td>
    <td class="price">${fmt(s.cg)}</td>
    <td class="price">${fmt(s.uon)}</td>
    <td class="price">${fmt(s.nhuom)}</td>
  </tr>`;
}

function render() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const fType = document.getElementById('filter-type').value;
  const sortMode = document.getElementById('sort-mode').value;
  
  let filtered = DATA.filter(s => {
    if (search && !(s.code.toLowerCase().includes(search) || (s.ten || '').toLowerCase().includes(search))) return false;
    if (fType && s.type !== fType) return false;
    return true;
  });
  
  renderStats(filtered);
  
  const tableHead = `<thead><tr>
    <th width="50">Loại</th><th width="160">Mã salon</th><th>Tên</th><th width="120">Tỉnh/TP</th>
    <th width="110">Cắt Gội</th><th width="110">Uốn</th><th width="110">Nhuộm</th>
  </tr></thead>`;
  
  if (sortMode === 'code') {
    filtered.sort((a, b) => a.code.localeCompare(b.code));
    let html = `<div class="cum-block">
      <div class="cum-header"><span>Sắp xếp theo mã salon</span><span class="badge">${filtered.length} salon</span></div>
      <table>${tableHead}<tbody>${filtered.map(renderRow).join('')}</tbody></table>
    </div>`;
    document.getElementById('results').innerHTML = html || '<div style="text-align:center;padding:40px;color:#666;">Không tìm thấy salon.</div>';
    return;
  }
  
  const cumGroups = {};
  filtered.forEach(s => {
    const k = s.cum === null ? 'doclap' : s.cum;
    (cumGroups[k] = cumGroups[k] || []).push(s);
  });
  
  // Apply mixed/warn filter
  const fMixed = document.getElementById('filter-mixed').value;
  let cumKeys = Object.keys(cumGroups);
  if (fMixed === 'mixed' || fMixed === 'warn') {
    cumKeys = cumKeys.filter(k => {
      if (k === 'doclap') return false;
      const salons = cumGroups[k];
      const hasCT = salons.some(s => s.type === 'CT');
      const hasNQ = salons.some(s => s.type === 'NQ' || s.type === 'DL');
      if (!hasCT || !hasNQ) return false;
      if (fMixed === 'warn') {
        const cgs = salons.map(s => s.cg).filter(v => v);
        if (cgs.length < 2) return false;
        return Math.max(...cgs) - Math.min(...cgs) > 5000;
      }
      return true;
    });
  }
  
  let html = '';
  cumKeys.sort((a, b) => {
    if (a === 'doclap') return 1; if (b === 'doclap') return -1;
    return Number(a) - Number(b);
  }).forEach(k => {
    const salons = cumGroups[k];
    const label = k === 'doclap' ? 'Salon Độc lập' : `CỤM ${k}`;
    
    // Detect mixed CT+NQ
    const hasCT = salons.some(s => s.type === 'CT');
    const hasNQ = salons.some(s => s.type === 'NQ' || s.type === 'DL');
    const isMixed = hasCT && hasNQ;
    
    // Spread CG
    const cgs = salons.map(s => s.cg).filter(v => v);
    const spread = cgs.length >= 2 ? Math.max(...cgs) - Math.min(...cgs) : 0;
    const isWarn = isMixed && spread > 5000;
    
    let headerCls = 'cum-header';
    if (isWarn) headerCls += ' warn';
    else if (isMixed) headerCls += ' mixed';
    
    let badges = `<span class="badge">${salons.length} salon</span>`;
    if (isMixed) {
      const ctN = salons.filter(s => s.type === 'CT').length;
      const nqN = salons.filter(s => s.type === 'NQ' || s.type === 'DL').length;
      badges += ` <span class="badge">CT ${ctN} + NQ ${nqN}</span>`;
    }
    if (spread > 0) {
      badges += ` <span class="badge spread-badge">Chênh CG: ${fmt(spread)}</span>`;
    }
    if (isWarn) badges += ' <span class="badge">⚠️ Cần align đuôi giá</span>';
    
    html += `<div class="cum-block">
      <div class="${headerCls}"><span>${label}</span><div>${badges}</div></div>
      <table>${tableHead}<tbody>${salons.map(renderRow).join('')}</tbody></table>
    </div>`;
  });
  
  document.getElementById('results').innerHTML = html || '<div style="text-align:center;padding:40px;color:#666;">Không tìm thấy salon.</div>';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-type').addEventListener('change', render);
document.getElementById('filter-mixed').addEventListener('change', render);
document.getElementById('sort-mode').addEventListener('change', render);
render();
</script>
