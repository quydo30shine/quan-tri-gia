// Build cum options
const cumSet = new Set();
DATA.forEach(s => { if (s.cum) cumSet.add(s.cum); });
const cumSel = document.getElementById('filter-cum');
[...cumSet].sort((a, b) => a - b).forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = `Cụm ${c}`;
  cumSel.appendChild(opt);
});

function fmt(n) {
  if (!n) return '<span style="color:#999">—</span>';
  return n.toLocaleString('vi-VN');
}

function fmtDelta(t3, gia55) {
  if (!t3 || !gia55) return '';
  const d = gia55 - t3;
  if (d === 0) return '<span class="delta-zero">≈</span>';
  const sign = d > 0 ? '+' : '';
  const cls = d > 0 ? 'delta-up' : 'delta-down';
  return `<span class="${cls}">${sign}${(d/1000).toFixed(1)}K</span>`;
}

function renderSalon(s, onlyFlagged) {
  const klass = s.type.toLowerCase();
  const cumLabel = s.cum ? `Cụm ${s.cum}` : '—';
  const gdkvLabel = s.gdkv && s.gdkv !== '—' && s.gdkv !== '?' ? `GDKV ${s.gdkv}` : '';

  // Group services by ngành
  const groups = {};
  s.services.forEach(sv => {
    const flag = Math.abs((sv.gia_55||0) - (sv.gia_t3||0)) >= 5000;
    if (onlyFlagged && !flag) return;
    if (!groups[sv.nganh]) groups[sv.nganh] = [];
    groups[sv.nganh].push({...sv, flag});
  });

  const groupOrder = ['SC — Cắt/Combo', 'Relax — Gội/LRT/DV lẻ', 'UND — Uốn/Nhuộm/Tẩy/Ép', 'Vận hành — Bảo hành'];
  const tableRows = [];
  let stt = 0;
  groupOrder.forEach(g => {
    if (!groups[g] || !groups[g].length) return;
    tableRows.push(`<tr><td colspan="6" class="group-header">${g} (${groups[g].length})</td></tr>`);
    groups[g].forEach(sv => {
      stt++;
      const flagCls = sv.flag ? 'flag-row' : '';
      const flagIcon = sv.flag ? ' <span class="flag-icon">⚠️</span>' : '';
      tableRows.push(`<tr class="${flagCls}">
        <td>${stt}</td>
        <td><strong>${sv.sid}</strong></td>
        <td>${sv.ten}${flagIcon}</td>
        <td class="num">${fmt(sv.gia_t3)}</td>
        <td class="num">${fmt(sv.gia_55)}</td>
        <td class="num">${fmtDelta(sv.gia_t3, sv.gia_55)}</td>
      </tr>`);
    });
  });

  const tableHTML = tableRows.length
    ? `<table><thead><tr><th>STT</th><th>SID</th><th>Tên DV</th><th class="num">Giá hiện tại (T3.2026)</th><th class="num">Giá đề xuất (5.5)</th><th class="num">Δ</th></tr></thead><tbody>${tableRows.join('')}</tbody></table>`
    : '<div class="empty-services">Salon chưa có data DV — chờ cập nhật từ V9 / file đề xuất NQ.</div>';

  const totalDV = s.services.filter(sv => !onlyFlagged || Math.abs((sv.gia_55||0) - (sv.gia_t3||0)) >= 5000).length;

  return `<div class="salon-card ${klass}" data-code="${s.code}" data-loai="${s.type}" data-cum="${s.cum||''}">
    <div class="salon-header">
      <h2>${s.ten} <span style="opacity:.7;font-weight:normal;font-size:13px">(${s.code})</span></h2>
      <div class="badges">
        <span class="badge">${s.loai}</span>
        <span class="badge">${cumLabel}</span>
        ${gdkvLabel ? `<span class="badge">${gdkvLabel}</span>` : ''}
        <span class="badge">${totalDV} DV</span>
      </div>
      <button class="copy-btn" onclick="copySalon('${s.code}', this)">📋 Copy bảng giá</button>
    </div>
    ${tableHTML}
  </div>`;
}

function copySalon(code, btn) {
  const s = DATA.find(x => x.code === code);
  if (!s) return;
  const lines = [`Bảng giá DV — ${s.ten} (${s.code})`,
                 `Loại: ${s.loai}${s.cum ? ' | Cụm ' + s.cum : ''}`,
                 `Giá hiện tại (T3.2026) → Giá đề xuất áp dụng (5.5.2026)`,
                 ``,
                 `STT | SID | Tên DV | Giá T3 | Giá 5/5 | Δ`];
  let stt = 0;
  s.services.forEach(sv => {
    stt++;
    const d = (sv.gia_55||0) - (sv.gia_t3||0);
    const sign = d > 0 ? '+' : '';
    lines.push(`${stt} | ${sv.sid} | ${sv.ten} | ${(sv.gia_t3||0).toLocaleString('vi-VN')} | ${(sv.gia_55||0).toLocaleString('vi-VN')} | ${sign}${(d/1000).toFixed(1)}K`);
  });
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    btn.textContent = '✓ Đã copy';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy bảng giá'; btn.classList.remove('copied'); }, 1800);
  });
}

function renderStats(filtered) {
  const totalSalons = filtered.length;
  const totalDVs = filtered.reduce((sum, s) => sum + s.services.length, 0);
  const totalFlag = filtered.reduce((sum, s) => sum + s.services.filter(sv => Math.abs((sv.gia_55||0) - (sv.gia_t3||0)) >= 5000).length, 0);
  const noData = filtered.filter(s => !s.services.length).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-pill"><strong>${totalSalons}</strong> salon hiển thị</div>
    <div class="stat-pill"><strong>${totalDVs.toLocaleString('vi-VN')}</strong> dòng giá</div>
    <div class="stat-pill warn"><strong>${totalFlag}</strong> DV cần check (chênh ≥5K)</div>
    ${noData ? `<div class="stat-pill danger"><strong>${noData}</strong> salon thiếu data</div>` : ''}
  `;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const fLoai = document.getElementById('filter-loai').value;
  const fCum = document.getElementById('filter-cum').value;
  const fFlag = document.getElementById('filter-flag').value === '1';

  let filtered = DATA;
  if (q) filtered = filtered.filter(s => (s.code + ' ' + s.ten + ' ' + s.tinh).toLowerCase().includes(q));
  if (fLoai) filtered = filtered.filter(s => s.type === fLoai);
  if (fCum) filtered = filtered.filter(s => String(s.cum) === fCum);

  // If onlyFlagged: keep only salons with at least one flagged service
  if (fFlag) filtered = filtered.filter(s => s.services.some(sv => Math.abs((sv.gia_55||0) - (sv.gia_t3||0)) >= 5000));

  renderStats(filtered);
  const html = filtered.map(s => renderSalon(s, fFlag)).join('');
  document.getElementById('results').innerHTML = html || '<div class="empty">Không tìm thấy salon. Thử bỏ filter.</div>';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-loai').addEventListener('change', render);
document.getElementById('filter-cum').addEventListener('change', render);
document.getElementById('filter-flag').addEventListener('change', render);

render();
</script>
