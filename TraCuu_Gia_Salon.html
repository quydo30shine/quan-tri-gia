const gdkvSet = new Set(DATA.map(s => s.gdkv).filter(g => g && g !== '?'));
const gdkvSel = document.getElementById('filter-gdkv');
[...gdkvSet].sort().forEach(g => {
  const opt = document.createElement('option');
  opt.value = g; opt.textContent = g;
  gdkvSel.appendChild(opt);
});

function fmt(n) { return n ? n.toLocaleString('vi-VN') + 'đ' : '—'; }

function renderStats(filtered) {
  const totalSalons = filtered.length;
  const totalServices = filtered.reduce((s, x) => s + x.services.length, 0);
  const flagged = filtered.reduce((s, x) => s + x.services.filter(sv => sv.flag).length, 0);
  document.getElementById('stats').innerHTML = `
    <div class="stat-pill"><strong>${totalSalons}</strong> salon hiển thị</div>
    <div class="stat-pill"><strong>${totalServices}</strong> dòng giá</div>
    <div class="stat-pill" style="color: var(--red);">⚠️ <strong>${flagged}</strong> giá lệch chuẩn cụm</div>
  `;
}

function renderSalon(salon, onlyFlag) {
  let services = salon.services;
  if (onlyFlag) services = services.filter(s => s.flag);
  if (services.length === 0) return '';
  
  // Group theo nhóm DV
  const groups = {};
  services.forEach(s => { (groups[s.nhom] = groups[s.nhom] || []).push(s); });
  
  let rows = '';
  Object.keys(groups).sort().forEach(g => {
    rows += `<tr><td colspan="6" class="group-header">${g}</td></tr>`;
    groups[g].forEach(s => {
      const flagCls = s.flag ? 'flag-row' : '';
      rows += `<tr class="${flagCls}">
        <td>${s.sid}</td>
        <td>${s.ten || '—'}</td>
        <td>${s.nhom_chi || ''}</td>
        <td class="price price-t3">${fmt(s.gia_lab)}</td>
        <td class="price price-chuan">${fmt(s.gia_chuan)}</td>
        <td>${s.flag || ''}</td>
      </tr>`;
    });
  });
  
  const klass = salon.is_an ? 'an' : (salon.is_dl ? 'dl' : '');
  return `
    <div class="salon-card ${klass}" data-code="${salon.code}">
      <div class="salon-header">
        <div>
          <h2>${salon.code}</h2>
          <div class="badges">
            <span class="badge">${salon.loai}</span>
            <span class="badge">${salon.gdkv}</span>
            ${salon.is_an ? '<span class="badge">⭐ Vùng An</span>' : ''}
          </div>
        </div>
        <button class="copy-btn" onclick="copyTable('${salon.code}')">📋 Copy bảng giá gửi đối tác</button>
      </div>
      <div class="salon-body">
        <table>
          <thead><tr>
            <th width="60">SID</th><th>Tên DV</th><th width="180">Nhóm</th>
            <th width="110">Giá đề xuất (5.5)</th><th width="110">Giá chuẩn cụm (median)</th><th width="40">Flag</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function copyTable(salonCode) {
  const salon = DATA.find(s => s.code === salonCode);
  if (!salon) return;
  // TSV format, raw numbers -> Excel paste ra dung dong/cot + number
  let text = `BẢNG GIÁ DỊCH VỤ — SALON ${salon.code} (${salon.loai}) — GDKV: ${salon.gdkv}\r\n`;
  text += `Giá đề xuất áp dụng từ 05/05/2026\r\n\r\n`;
  text += 'STT\tSID\tTên DV\tNhóm\tGiá đề xuất (5.5)\tGhi chú\r\n';
  salon.services.forEach((s, i) => {
    if (s.gia_chuan > 0) {
      text += `${i+1}\t${s.sid}\t${s.ten || ''}\t${s.nhom_chi || ''}\t${s.gia_chuan}\t${s.flag ? 'Đã align' : 'OK'}\r\n`;
    }
  });
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '✓ Đã copy (paste vào Excel)';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 Copy bảng giá gửi đối tác'; btn.classList.remove('copied'); }, 2000);
  });
}

function render() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const fGdkv = document.getElementById('filter-gdkv').value;
  const fLoai = document.getElementById('filter-loai').value;
  const fFlag = document.getElementById('filter-flag').value === '1';
  
  let filtered = DATA.filter(s => {
    if (search && !s.code.toLowerCase().includes(search)) return false;
    if (fGdkv && s.gdkv !== fGdkv) return false;
    if (fLoai === 'VÙNG AN' && !s.is_an) return false;
    if (fLoai === 'Độc lập' && !s.is_dl) return false;
    if (fLoai === 'cum' && (s.is_an || s.is_dl)) return false;
    return true;
  });
  
  renderStats(filtered);
  const html = filtered.map(s => renderSalon(s, fFlag)).filter(x => x).join('');
  document.getElementById('results').innerHTML = html || '<div class="empty">Không tìm thấy salon. Thử bỏ filter.</div>';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filter-gdkv').addEventListener('change', render);
document.getElementById('filter-loai').addEventListener('change', render);
document.getElementById('filter-flag').addEventListener('change', render);

render();
</script>
</body>
</html>
